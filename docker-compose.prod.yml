# Production override — use with: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# What this changes from the base docker-compose.yml:
# - Removes the frontend service (Vercel handles it)
# - Sets restart: always (survive reboots)
# - Passes FRONTEND_URL and OPENALEX env vars through
# - Sets WEB_CONCURRENCY=1 (single async worker handles the traffic; saves ~150MB)
# - Caps container logs at 3 x 50MB (json-file is unbounded by default; the api
#   log reached ~1GB). Applies when a container is (re)created.

x-logging: &logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "3"

services:
  db:
    restart: always
    logging: *logging

  api:
    restart: always
    mem_limit: 1g
    logging: *logging
    environment:
      FRONTEND_URL: ${FRONTEND_URL:?FRONTEND_URL is required}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-20}
      OPENALEX_API_KEY: ${OPENALEX_API_KEY:-}
      OPENALEX_MAILTO: ${OPENALEX_MAILTO:-}
      OPENALEX_DAILY_BUDGET: ${OPENALEX_DAILY_BUDGET:-1000}
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-1}
      ENRICHMENT_WORKER_ENABLED: ${ENRICHMENT_WORKER_ENABLED:-false}
      EXTRACTION_WORKER_ENABLED: ${EXTRACTION_WORKER_ENABLED:-false}
      EXTRACTION_DELAY_SECONDS: ${EXTRACTION_DELAY_SECONDS:-2}
      EXTRACTION_CONCURRENCY: ${EXTRACTION_CONCURRENCY:-2}
      SCRAPE_ON_STARTUP: ${SCRAPE_ON_STARTUP:-true}
      SCRAPE_INTERVAL_HOURS: ${SCRAPE_INTERVAL_HOURS:-48}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?NEXTAUTH_SECRET is required}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      DIGEST_FROM_EMAIL: ${DIGEST_FROM_EMAIL:-digest@econ-newsfeed.com}
      LOGIN_FROM_EMAIL: ${LOGIN_FROM_EMAIL:-}
      EMAIL_LOGIN_HOURLY_LIMIT: ${EMAIL_LOGIN_HOURLY_LIMIT:-200}
      GMAIL_CLIENT_ID: ${GMAIL_CLIENT_ID:-}
      GMAIL_CLIENT_SECRET: ${GMAIL_CLIENT_SECRET:-}
      GMAIL_REFRESH_TOKEN: ${GMAIL_REFRESH_TOKEN:-}
      SEARLO_API_KEY: ${SEARLO_API_KEY:-}
      DISCOVERY_DAILY_LIMIT: ${DISCOVERY_DAILY_LIMIT:-1000}
      DISCOVERY_SEARCH_DELAY: ${DISCOVERY_SEARCH_DELAY:-18}
      SITE_MINING_ENABLED: ${SITE_MINING_ENABLED:-false}
      SITE_MINING_SOURCE_LIMIT: ${SITE_MINING_SOURCE_LIMIT:-500}
      SITE_MINING_CANDIDATE_LIMIT: ${SITE_MINING_CANDIDATE_LIMIT:-30}
      SITE_MINING_MAX_REQUESTS: ${SITE_MINING_MAX_REQUESTS:-200}
      SITE_MINING_MAX_SECONDS: ${SITE_MINING_MAX_SECONDS:-600}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      QUALITY_REVIEW_ENABLED: ${QUALITY_REVIEW_ENABLED:-false}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-}
      API_DIRECT_ACCESS: ${API_DIRECT_ACCESS:-open}
      API_MAX_PER_PAGE: ${API_MAX_PER_PAGE:-50}
      API_MAX_RESULT_DEPTH: ${API_MAX_RESULT_DEPTH:-2000}
      RATE_LIMIT_DATA: ${RATE_LIMIT_DATA:-}
      RATE_LIMIT_DATA_DIRECT: ${RATE_LIMIT_DATA_DIRECT:-}
      RATE_LIMIT_DATA_USER: ${RATE_LIMIT_DATA_USER:-}
      RATE_LIMIT_DATA_LEGACY: ${RATE_LIMIT_DATA_LEGACY:-}
      RATE_LIMIT_SSR: ${RATE_LIMIT_SSR:-}
      RATE_LIMIT_OPTIONS: ${RATE_LIMIT_OPTIONS:-}
      RATE_LIMIT_OPTIONS_DIRECT: ${RATE_LIMIT_OPTIONS_DIRECT:-}
      JEL_CLASSIFICATION_ENABLED: ${JEL_CLASSIFICATION_ENABLED:-false}
      JEL_CLASSIFICATION_INTERVAL_MINUTES: ${JEL_CLASSIFICATION_INTERVAL_MINUTES:-60}
      JEL_CLASSIFICATION_BATCH_CALLS: ${JEL_CLASSIFICATION_BATCH_CALLS:-40}
      JEL_CLASSIFICATION_DAILY_LIMIT: ${JEL_CLASSIFICATION_DAILY_LIMIT:-600}
      JEL_CLASSIFICATION_DELAY_SECONDS: ${JEL_CLASSIFICATION_DELAY_SECONDS:-20}
      JEL_RECLASSIFY_AFTER_DAYS: ${JEL_RECLASSIFY_AFTER_DAYS:-30}
      JEL_YIELD_AFTER_QUOTA_MINUTES: ${JEL_YIELD_AFTER_QUOTA_MINUTES:-15}
      JEL_MAX_EXTRACTION_BACKLOG: ${JEL_MAX_EXTRACTION_BACKLOG:-1000}

  frontend:
    profiles:
      - disabled
