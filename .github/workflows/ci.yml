name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    services:
      # Only for tests that need real SQL (TEST_MYSQL_*); on 3307 so tests
      # that expect no database at DB_HOST:3306 are unaffected.
      mysql:
        image: mysql:8.0.40
        env:
          MYSQL_ROOT_PASSWORD: test
        ports:
          - 3307:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -ptest"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      TEST_MYSQL_HOST: "127.0.0.1"
      TEST_MYSQL_PORT: "3307"
      TEST_MYSQL_PASSWORD: "test"
      CONTENT_MAX_CHARS: "20000"
      LLM_MODEL: "gemini-2.5-flash"
      GOOGLE_API_KEY: "test-not-real"
      SCRAPE_API_KEY: "test-secret-key-for-ci-runs"
      DB_HOST: "localhost"
      DB_USER: "test"
      DB_PASSWORD: "test"
      DB_NAME: "test_econ_newsfeed"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: pip install poetry

      - name: Install dependencies
        run: poetry install --no-interaction

      - name: Security audit (pip)
        run: pip install pip-audit && pip-audit 2>&1 || true
        continue-on-error: true

      - name: Run pytest
        run: poetry run pytest -q --tb=short --ignore=tests/test_imports.py -k "not test_private_ip_url_returns_invalid"

  frontend:
    name: Frontend (jest + tsc)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Security audit (npm)
        run: npm audit --omit=dev --audit-level=high

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Run Jest
        run: npm test -- --passWithNoTests

      - name: Lint
        run: npm run lint

      - name: Production build
        run: npm run build
