version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /app
    schedule:
      interval: weekly
    ignore:
      # Tailwind v3→v4 is a breaking migration (new config format, new CSS
      # syntax). Block major bumps for the CSS toolchain so Dependabot can't
      # silently break styling again.
      - dependency-name: "tailwindcss"
        update-types: ["version-update:semver-major"]
      - dependency-name: "postcss"
        update-types: ["version-update:semver-major"]
      # Next.js majors (14→15→16) are deliberate migrations (React 19, async
      # request APIs). Upgrade manually, not via Dependabot.
      - dependency-name: "next"
        update-types: ["version-update:semver-major"]
      # React 19 comes with the Next.js migration, not on its own — v19 types
      # against the React 18 app fail npm ci with ERESOLVE.
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react-dom"
        update-types: ["version-update:semver-major"]
      # eslint 9+ requires the flat-config migration; do it with the Next.js
      # toolchain upgrade, not as a routine bump.
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      # TypeScript majors break the frontend build; upgrade with the Next.js
      # toolchain migration.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
